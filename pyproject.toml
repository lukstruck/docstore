[project]
name = "docstore"
version = "0.1.0"
description = "Python documentation store with semantic search, ChromaDB backend, and MCP/HTTP APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "gitpython>=3.1.0",
    "packaging>=24.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "mcp>=1.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
docstore = "docstore.cli:app"
docstore-server = "docstore.main:run"
docstore-mcp = "docstore.mcp_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docstore"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
